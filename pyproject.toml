[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-learn"
dynamic = ["version"]
description = "YouTube video storyboard generator for Vision LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Zengin" }]
keywords = ["youtube", "storyboard", "vision-llm", "transcript", "video", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "yt-dlp>=2024.3.10",
    "Pillow>=10.3.0",
    "groq>=0.5.0",
    "click>=8.1.7",
    "webvtt-py>=0.4.6",
    "spacy>=3.7.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
watch-learn = "watch_learn.main:cli"

[project.urls]
Homepage = "https://github.com/ozanzeng/watch-learn"
Repository = "https://github.com/ozanzeng/watch-learn"
Issues = "https://github.com/ozanzeng/watch-learn/issues"

[tool.setuptools.dynamic]
version = { attr = "watch_learn.__version__" }

[tool.setuptools]
packages = ["watch_learn"]

[tool.setuptools.package-data]
watch_learn = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["watch_learn", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "ISC", "PL"]
ignore = [
    "PLC0415",  # lazy imports keep CLI startup and optional deps cheap
    "PLR0911",  # grid layout intentionally has many early returns
    "PLR0912",  # pipeline orchestration branches are readable
    "PLR0913",  # CLI and compiler functions take explicit options
    "PLR0915",  # the CLI entry point is a linear pipeline
    "PLR0917",  # helper functions pass pipeline state positionally
    "PLR2004",  # magic values are explained by named constants / docs
    "RUF001",   # Turkish text legitimately uses dotless i
    "RUF002",
    "RUF003",
    "RUF005",   # list concatenation reads better in the report builders
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:watch_learn.*"]

[tool.coverage.run]
source = ["watch_learn"]
omit = ["watch_learn/main.py"]
